services:
  db:
    image: postgres:16
    container_name: mechanical_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mechanical_analytics
    ports:
      - "5432:5432"
    volumes:
      - mechanical_analytics_pgdata:/var/lib/postgresql/data

volumes:
  mechanical_analytics_pgdata:
